</head>
<body class="bg-[#07130e] text-amber-50 font-sans selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- DATA MASTER PESERTA REGU ---
    const INITIAL_TEAMS = [
      // Regu Putra (PA) - Gudep 10.055
      { id: 'pa-1', name: 'Phoenix', gender: 'PA', avatar: '🦅', borderColor: 'border-amber-500', pinru: 'Farel', members: ['Farel (Pinru)', 'Ziven', 'Afla', 'Arya', 'Wika', 'Rasya', 'Arfian', 'Aldi', 'Sulton'] },
      { id: 'pa-2', name: 'Scorpio', gender: 'PA', avatar: '🦂', borderColor: 'border-red-500', pinru: 'Iqbal', members: ['Iqbal (Pinru)', 'Okta', 'Dodit', 'Rafala', 'Aruna', 'Bian', 'Nando', 'Liham', 'Eky'] },
      { id: 'pa-3', name: 'Black Panther', gender: 'PA', avatar: '🐆', borderColor: 'border-emerald-500', pinru: 'Evan', members: ['Evan (Pinru)', 'Ravael', 'Latif', 'Dwik', 'Hafi', 'Abi', 'Gebril', 'Krisna', 'Sani'] },
      { id: 'pa-4', name: 'Buaya', gender: 'PA', avatar: '🐊', borderColor: 'border-teal-500', pinru: 'Nino', members: ['Nino (Pinru)', 'Rehan', 'Zidny', 'Wildan', 'Dama', 'Hoho', 'Rizal', 'Adit', 'Rey', 'Gilang'] },
      // Regu Putri (PI) - Gudep 10.056
      { id: 'pi-1', name: 'Lotus', gender: 'PI', avatar: '🪷', borderColor: 'border-pink-400', pinru: 'Afifa', members: ['Afifa (Pinru)', 'Naura', 'Navya', 'Shidqia', 'Nadya', 'Farah', 'Kenia', 'Celin'] },
      { id: 'pi-2', name: 'Lavender', gender: 'PI', avatar: '🪻', borderColor: 'border-purple-400', pinru: 'Nafla', members: ['Nafla (Pinru)', 'Cherly', 'Rara', 'Cinta', 'Nayla', 'Devni', 'Gendhis', 'Febri'] },
      { id: 'pi-3', name: 'Peony', gender: 'PI', avatar: '🌺', borderColor: 'border-rose-400', pinru: 'Kirana', members: ['Kirana (Pinru)', 'Inara', 'Ara', 'Talita', 'Cantika', 'Gadis', 'Alya', 'Azalea'] },
      { id: 'pi-4', name: 'Queen Violet', gender: 'PI', avatar: '👑', borderColor: 'border-violet-400', pinru: 'Kila', members: ['Kila (Pinru)', 'Alesa', 'Dinda', 'Sinta', 'Nacuwa', 'Deavika', 'Keisya', 'Nimas', 'Raisha'] }
    ];

    // --- DAFTAR CABANG LOMBA LENGKAP (11 CABANG SESUAI JUKNIS) ---
    const CONTEST_CONFIG = [
      { id: 'pbb', category: 'Kategori 1: PBB', categoryGroup: 'PBB', title: 'PBB Bertongkat', icon: '🎖️', peserta: '7 orang (1 Danton + 6 Pasukan)', waktu: 'Maks. 5 Menit', criteria: [{ key: 'kekompakan', label: 'Kekompakan', max: 40 }, { key: 'danton', label: 'Danton', max: 20 }, { key: 'ketepatan', label: 'Ketepatan Aba-aba', max: 40 }] },
      { id: 'morse', category: 'Kategori 2: Tekspram', categoryGroup: 'TEKSPRAM', title: 'Morse', icon: '📡', peserta: '2 orang', waktu: '2 Menit (50 Huruf)', criteria: [{ key: 'score', label: 'Ketepatan (0-100)', max: 100 }] },
      { id: 'sandi', category: 'Kategori 2: Tekspram', categoryGroup: 'TEKSPRAM', title: 'Sandi-Sandi', icon: '📜', peserta: '5 orang', waktu: '30 Menit (5 Soal)', criteria: [{ key: 'score', label: 'Ketepatan (0-100)', max: 100 }] },
      { id: 'semaphore', category: 'Kategori 2: Tekspram', categoryGroup: 'TEKSPRAM', title: 'Semaphore', icon: '🚩', peserta: '2 orang', waktu: '2 Menit (50 Huruf)', criteria: [{ key: 'score', label: 'Ketepatan (0-100)', max: 100 }] },
      { id: 'makanan', category: 'Kategori 3: Life Skill', categoryGroup: 'LIFESKILL', title: 'Menghias Makanan', icon: '🍰', peserta: '3 orang', waktu: '60 Menit (Desserts)', criteria: [{ key: 'tema', label: 'Kesesuaian Tema', max: 45 }, { key: 'rasa', label: 'Rasa', max: 25 }, { key: 'kreatifitas', label: 'Kreatifitas', max: 30 }] },
      { id: 'minuman', category: 'Kategori 3: Life Skill', categoryGroup: 'LIFESKILL', title: 'Menghias Minuman', icon: '🍹', peserta: '3 orang', waktu: '60 Menit (Buah-buahan)', criteria: [{ key: 'tema', label: 'Kesesuaian Tema', max: 45 }, { key: 'rasa', label: 'Rasa', max: 25 }, { key: 'kreatifitas', label: 'Kreatifitas', max: 30 }] },
      { id: 'meja', category: 'Kategori 3: Life Skill', categoryGroup: 'LIFESKILL', title: 'Menata Meja Makan', icon: '🍽️', peserta: '2 orang', waktu: '30 Menit (Pramuka/Merdeka)', criteria: [{ key: 'tema', label: 'Kesesuaian Tema', max: 45 }, { key: 'plating', label: 'Plating', max: 25 }, { key: 'kreatifitas', label: 'Kreatifitas', max: 30 }] },
      { id: 'dance', category: 'Kategori 4: Seni Budaya', categoryGroup: 'SENI', title: 'Semaphore Dance', icon: '💃', peserta: '7 orang', waktu: 'Maks. 5 Menit ("PRAMUKA OPTIMIS")', criteria: [{ key: 'kreatifitas', label: 'Kreatifitas', max: 30 }, { key: 'kekompakan', label: 'Kekompakan', max: 30 }, { key: 'isiPentas', label: 'Isi Pentas', max: 40 }] },
      { id: 'ketangkasan_sentil', category: 'Kategori 5: Ketangkasan', categoryGroup: 'KETANGKASAN', title: 'Ketangkasan 1: Sentil Karet', icon: '🎯', peserta: '1 orang', waktu: 'Sabtu Pagi (07.00 - 08.00)', criteria: [{ key: 'score', label: 'Akurasi & Keberhasilan (0-100)', max: 100 }] },
      { id: 'ketangkasan_pingpong', category: 'Kategori 5: Ketangkasan', categoryGroup: 'KETANGKASAN', title: 'Ketangkasan 2: Estafet Pingpong', icon: '🏓', peserta: '3 orang', waktu: 'Sabtu Pagi (07.00 - 08.00)', criteria: [{ key: 'score', label: 'Kekompakan & Keberhasilan (0-100)', max: 100 }] },
      { id: 'ketangkasan_tikus', category: 'Kategori 5: Ketangkasan', categoryGroup: 'KETANGKASAN', title: 'Ketangkasan 3: Jebakan Tikus', icon: '🪤', peserta: '5 orang', waktu: 'Sabtu Pagi (07.00 - 08.00)', criteria: [{ key: 'score', label: 'Strategi & Keberhasilan (0-100)', max: 100 }] }
    ];

    // --- RUNDOWN KEGIATAN LT-1 RESMI ---
    const RUNDOWN_SCHEDULE = [
      {
        dayId: 'day1',
        dayTitle: 'Jumat, 28 Agustus 2026',
        dayNumber: 5,
        events: [
          { start: '12:30', end: '13:00', title: 'Registrasi Peserta', icon: '📝', desc: 'Pengecekan kelengkapan peserta dan administrasi kavling tenda.' },
          { start: '13:00', end: '14:00', title: 'Upacara Pembukaan LT-1', icon: '⚜️', desc: 'Penyematan tanda peserta oleh Mabigus SDN Watutulis 2.' },
          { start: '14:00', end: '14:30', title: 'PBB Bertongkat (7 orang)', icon: '🎖️', desc: '1 Danton + 6 Pasukan bersaf. Waktu maksimal 5 menit.' },
          { start: '14:30', end: '15:00', title: 'Tekspram (Semaphore, Morse, Sandi)', icon: '📡', desc: 'Semaphore (2 org), Morse (2 org), Sandi-Sandi (3 org).' },
          { start: '15:00', end: '15:30', title: 'Istirahat & Sholat Ashar', icon: '🕌', desc: 'Ibadah sholat Ashar berjamaah di Buper.' },
          { start: '15:30', end: '17:00', title: 'Life Skill (Makanan, Minuman, Meja)', icon: '🍰', desc: 'Menghias Makanan (3 org), Minuman (3 org), Menata Meja (2 org).' },
          { start: '17:00', end: '19:00', title: 'ISHOMA', icon: '🍱', desc: 'Istirahat, Sholat Maghrib & Isya, makan malam bersama.' },
          { start: '19:00', end: '20:00', title: '🔥 Upacara Api Unggun', icon: '🔥', desc: 'Penyalaan Api Dasa Darma dan malam renungan pramuka.' },
          { start: '20:00', end: '22:30', title: '💃 Dance Semaphore (7 orang)', icon: '💃', desc: 'Pentas seni Semaphore Dance bertema "PRAMUKA OPTIMIS".' },
          { start: '22:30', end: '24:00', title: 'Melukis Langit & Refleksi Malam', icon: '✨', desc: 'Malam tenang dan persiapan istirahat regu.' }
        ]
      },
      {
        dayId: 'day2',
        dayTitle: 'Sabtu, 29 Agustus 2026',
        dayNumber: 6,
        events: [
          { start: '00:00', end: '04:00', title: 'Istirahat Malam / Tidur Lelap', icon: '⛺', desc: 'Istirahat total menjaga stamina tubuh.' },
          { start: '04:00', end: '05:00', title: 'Sholat Subuh & Giat Pribadi', icon: '🕌', desc: 'Sholat Subuh berjamaah dan kebersihan diri.' },
          { start: '05:00', end: '07:00', title: 'Senam Pagi & Sarapan', icon: '🏃‍♂️', desc: 'Senam Pramuka bersama dan makan pagi regu.' },
          { start: '07:00', end: '08:00', title: '⚡ Ketangkasan 1 (1), 2 (3), 3 (5)', icon: '⚡', desc: 'Sentil Karet (1 org), Estafet Pingpong (3 org), Jebakan Tikus (5 org).' },
          { start: '08:00', end: '09:00', title: 'Makan & Bersiap / Bongkar Tenda', icon: '🏕️', desc: 'Operasi semut kebersihan kavling dan persiapan penutupan.' },
          { start: '10:00', end: '12:00', title: '🏆 Upacara Penutupan & Pengumuman Juara', icon: '🏅', desc: 'Penetapan Regu Berprestasi Tinggi, Baik, Cukup LT-1 2026.' }
        ]
      }
    ];

    function App() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [activeTab, setActiveTab] = useState('leaderboard');
      const [selectedGender, setSelectedGender] = useState('ALL');
      const [selectedContestId, setSelectedContestId] = useState(CONTEST_CONFIG[0].id);
      const [searchMember, setSearchMember] = useState('');

      // Nilai Default Kosong
      const [scores, setScores] = useState(() => {
        try {
          const saved = localStorage.getItem('LT1_SCORES_2026');
          return saved ? JSON.parse(saved) : {};
        } catch(e) {
          return {};
        }
      });

      const [sheetWebhookUrl, setSheetWebhookUrl] = useState(() => {
        return localStorage.getItem('LT1_SHEET_WEBHOOK') || '';
      });

      const [currentTime, setCurrentTime] = useState(new Date());
      const [isSaving, setIsSaving] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      // Timer Detik Jam Digital
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Simpan perubahan nilai ke LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem('LT1_SCORES_2026', JSON.stringify(scores));
        } catch(e) {}
      }, [scores]);

      // Sinkronisasi Hari & Agenda Berdasarkan Waktu
      const currentScheduleStatus = useMemo(() => {
        const now = currentTime;
        const dayOfWeek = now.getDay(); // 5 = Jumat, 6 = Sabtu
        const activeDaySchedule = (dayOfWeek === 6) ? RUNDOWN_SCHEDULE[1] : RUNDOWN_SCHEDULE[0];

        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        let activeEvent = null;
        let nextEvent = null;

        for (let i = 0; i < activeDaySchedule.events.length; i++) {
          const ev = activeDaySchedule.events[i];
          const [sh, sm] = ev.start.split(':').map(Number);
          const [eh, em] = ev.end.split(':').map(Number);
          const startMin = sh * 60 + sm;
          const endMin = eh * 60 + em;

          if (nowMinutes >= startMin && nowMinutes < endMin) {
            activeEvent = ev;
            nextEvent = activeDaySchedule.events[i + 1] || null;
            break;
          }
        }

        if (!activeEvent) {
          for (let i = 0; i < activeDaySchedule.events.length; i++) {
            const ev = activeDaySchedule.events[i];
            const [sh, sm] = ev.start.split(':').map(Number);
            const startMin = sh * 60 + sm;
            if (nowMinutes < startMin) {
              nextEvent = ev;
              break;
            }
          }
        }

        return {
          activeDayTitle: activeDaySchedule.dayTitle,
          activeEvent,
          nextEvent,
          nowMinutes
        };
      }, [currentTime]);

      // Login Admin Juri
      const handleLogin = (e) => {
        if (e) e.preventDefault();
        const clean = passwordInput.trim().toUpperCase();
        if (clean === 'SEKOLAHFAVORIT') {
          setIsAdmin(true);
          setShowLoginModal(false);
          setPasswordInput('');
          setErrorMsg('');
          showToast('🔓 Akses Dewan Juri Terbuka');
        } else {
          setErrorMsg('Kata sandi salah. Silakan coba lagi.');
        }
      };

      const handleLogout = () => {
        setIsAdmin(false);
        setPasswordInput('');
        showToast('🔒 Panel Juri Dikunci');
      };

      // Hitung Total Nilai Per Lomba
      const calculateTotal = (contestId, teamId) => {
        const raw = scores[`${contestId}_${teamId}`];
        if (!raw) return 0;
        const cfg = CONTEST_CONFIG.find(c => c.id === contestId);
        if (!cfg) return 0;
        let tot = 0;
        let hasVal = false;
        cfg.criteria.forEach(cr => {
          if (raw[cr.key] !== undefined && raw[cr.key] !== '') {
            hasVal = true;
            tot += parseFloat(raw[cr.key]) || 0;
          }
        });
        return hasVal ? parseFloat(tot.toFixed(1)) : 0;
      };

      // Cek Keberadaan Nilai Masuk
      const hasAnyScore = useMemo(() => {
        return Object.values(scores).some(entry => {
          if (!entry) return false;
          return Object.values(entry).some(val => val !== '' && val !== null && !isNaN(val) && Number(val) > 0);
        });
      }, [scores]);

      // Kalkulasi Medali Tiap Lomba (Per Gender)
      const contestRankings = useMemo(() => {
        const res = {};
        CONTEST_CONFIG.forEach(c => {
          ['PA', 'PI'].forEach(g => {
            const list = INITIAL_TEAMS.filter(t => t.gender === g)
              .map(t => ({ team: t, score: calculateTotal(c.id, t.id) }))
              .sort((a, b) => b.score - a.score);

            list.forEach((item, idx) => {
              let medal = null;
              if (item.score > 0) {
                if (idx === 0) medal = 'GOLD';
                else if (idx === 1) medal = 'SILVER';
                else if (idx === 2) medal = 'BRONZE';
              }
              res[`${c.id}_${item.team.id}`] = {
                rank: idx + 1,
                medal: medal,
                score: item.score
              };
            });
          });
        });
        return res;
      }, [scores]);

      // Klasemen Regu Berprestasi (Juknis Bab IV)[cite: 1]
      const overallStandings = useMemo(() => {
        return ['PA', 'PI'].reduce((acc, g) => {
          const list = INITIAL_TEAMS.filter(t => t.gender === g).map(team => {
            let gold = 0, silver = 0, bronze = 0, total = 0, tekspramGold = 0, lifeSkillGold = 0;
            CONTEST_CONFIG.forEach(c => {
              const rankInfo = contestRankings[`${c.id}_${team.id}`];
              const sc = rankInfo ? rankInfo.score : 0;
              total += sc;
              if (rankInfo?.medal === 'GOLD') {
                gold++;
                if (c.categoryGroup === 'TEKSPRAM') tekspramGold++;
                if (c.categoryGroup === 'LIFESKILL') lifeSkillGold++;
              } else if (rankInfo?.medal === 'SILVER') silver++;
              else if (rankInfo?.medal === 'BRONZE') bronze++;
            });
            return {
              team,
              gold,
              silver,
              bronze,
              tekspramGold,
              lifeSkillGold,
              totalOverallScore: parseFloat(total.toFixed(1))
            };
          });

          // Tie-Breaker: Emas -> Perak -> Perunggu -> Emas Tekspram -> Emas LifeSkill -> Total Skor[cite: 1]
          list.sort((a, b) => {
            if (b.gold !== a.gold) return b.gold - a.gold;
            if (b.silver !== a.silver) return b.silver - a.silver;
            if (b.bronze !== a.bronze) return b.bronze - a.bronze;
            if (b.tekspramGold !== a.tekspramGold) return b.tekspramGold - a.tekspramGold;
            if (b.lifeSkillGold !== a.lifeSkillGold) return b.lifeSkillGold - a.lifeSkillGold;
            return b.totalOverallScore - a.totalOverallScore;
          });

          acc[g] = list.map((item, idx) => ({
            ...item,
            rank: idx + 1,
            title: (item.totalOverallScore === 0)
              ? 'Menunggu Penilaian Juri'
              : (idx === 0 ? 'Regu Berprestasi Tinggi (Juara 1)' : idx === 1 ? 'Regu Berprestasi Baik (Juara 2)' : idx === 2 ? 'Regu Berprestasi Cukup (Juara 3)' : 'Regu Penggalang Berbakat')
          }));
          return acc;
        }, {});
      }, [contestRankings]);

      // Input Nilai
      const handleScoreInputChange = (contestId, teamId, critKey, value, maxVal) => {
        let val = value === '' ? '' : Math.max(0, Math.min(maxVal, parseFloat(value) || 0));
        setScores(prev => ({
          ...prev,
          [`${contestId}_${teamId}`]: {
            ...(prev[`${contestId}_${teamId}`] || {}),
            [critKey]: val
          }
        }));
      };

      // Simpan Nilai ke Webhook Google Sheets
      const handleSaveScores = async () => {
        setIsSaving(true);
        if (sheetWebhookUrl && sheetWebhookUrl.startsWith('http')) {
          try {
            await fetch(sheetWebhookUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                timestamp: new Date().toISOString(),
                scores: scores,
                overallStandings: overallStandings
              })
            });
            showToast('✅ Nilai disinkronkan ke Google Sheet Webhook!');
          } catch(err) {
            showToast('⚠️ Gagal terhubung ke Webhook. Tersimpan di memori browser.');
          }
        } else {
          showToast('💾 Nilai berhasil disimpan di memori browser!');
        }
        setIsSaving(false);
      };

      // Unduh Rekap CSV
      const handleDownloadExcelCSV = () => {
        let csv = 'KATEGORI,PERINGKAT,NAMA REGU,PINRU,EMAS,PERAK,PERUNGGU,TOTAL SKOR,STATUS PRESTASI\n';
        ['PA', 'PI'].forEach(g => {
          overallStandings[g].forEach(r => {
            csv += `"${g === 'PA' ? 'Putra' : 'Putri'}","${r.rank}","Regu ${r.team.name}","${r.team.pinru}","${r.gold}","${r.silver}","${r.bronze}","${r.totalOverallScore}","${r.title}"\n`;
          });
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Rekap_Nilai_LT1_Watutulis2_2026.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('📥 Berkas CSV berhasil diunduh!');
      };

      // Salin Tautan
      const handleCopyShare = () => {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
          showToast('📋 Link berhasil disalin ke clipboard!');
        });
      };

      return (
        <div className="min-h-screen relative overflow-hidden pb-12">
          {/* Background Ambient Glow */}
          <div className="fixed inset-0 pointer-events-none z-0">
            <div className="absolute -top-32 -left-32 w-96 h-96 bg-amber-600/15 rounded-full blur-[120px] neon-bg-1"></div>
            <div className="absolute top-1/3 -right-32 w-[28rem] h-[28rem] bg-emerald-600/15 rounded-full blur-[140px] neon-bg-2"></div>
            <div className="absolute -bottom-32 left-1/3 w-96 h-96 bg-purple-600/15 rounded-full blur-[130px] neon-bg-3"></div>
            <div className="absolute inset-0 bg-[radial-gradient(#143324_1px,transparent_1px)] [background-size:24px_24px] opacity-40"></div>
          </div>

          {/* Header Utama */}
          <header className="relative z-20 border-b border-amber-900/60 bg-gradient-to-r from-emerald-950/95 via-[#0b1b13]/95 to-amber-950/95 backdrop-blur-md shadow-2xl sticky top-0">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3 text-center md:text-left">
                <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 via-amber-600 to-emerald-700 p-0.5 shadow-lg shadow-amber-500/25 flex-shrink-0 animate-pulse">
                  <div className="w-full h-full bg-[#081510] rounded-[14px] flex items-center justify-center text-2xl">
                    ⚜️
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-2 justify-center md:justify-start flex-wrap">
                    <span className="px-2 py-0.5 text-[10px] font-black uppercase bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-md">
                      LT-1 2026
                    </span>
                    <span className="text-xs text-emerald-400 font-semibold">Gudep 10.055 – 10.056[cite: 1]</span>
                  </div>
                  <h1 className="text-base sm:text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-400">
                    SD NEGERI WATUTULIS 2
                  </h1>
                </div>

                        </div>
                        <div>
                          <h4 className="text-base font-black text-white">Regu {team.name}</h4>
                          <p className="text-xs text-amber-300 font-semibold">Pinru: {team.pinru}</p>
                        </div>
                        <div className="border-t border-emerald-900/60 pt-2">
                          <p className="text-[10px] text-emerald-400 uppercase font-bold mb-1">Anggota ({team.members.length}):</p>
                          <ul className="text-xs text-emerald-200/80 space-y-0.5">
                            {team.members.map((m, idx) => (
                              <li key={idx}>{idx + 1}. {m}</li>
                            ))}
                          </ul>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ================= TAB 5: JUKNIS & RUNDOWN ================= */}
            {activeTab === 'juknis' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {RUNDOWN_SCHEDULE.map(day => (
                    <div key={day.dayId} className="bg-[#091711] border border-emerald-800 p-4 rounded-2xl space-y-3">
                      <h4 className="text-sm font-black text-amber-300 border-b border-emerald-800 pb-2">{day.dayTitle}</h4>
                      <div className="space-y-2">
                        {day.events.map((ev, idx) => (
                          <div key={idx} className="p-2.5 bg-[#050e0a] rounded-xl border border-emerald-950 flex items-start gap-2.5">
                            <span className="text-lg">{ev.icon}</span>
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-white">{ev.title}</span>
                                <span className="text-[10px] font-mono text-amber-400">{ev.start} - {ev.end} WIB</span>
                              </div>
                              <p className="text-[11px] text-emerald-300/80 mt-0.5">{ev.desc}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ================= TAB 6: CETAK BERITA ACARA ================= */}
            {activeTab === 'print' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center bg-[#10241b] p-3 rounded-xl border border-amber-500/40">
                  <span className="text-xs font-bold text-amber-300">Format Berita Acara Siap Cetak</span>
                  <button onClick={() => window.print()} className="px-4 py-1.5 bg-amber-500 text-black font-black text-xs rounded-xl">
                    🖨️ Cetak / PDF
                  </button>
                </div>

                <div className="bg-white text-black p-6 rounded-2xl max-w-4xl mx-auto space-y-4 text-xs border border-gray-300">
                  <div className="text-center border-b-2 border-black pb-2">
                    <p className="font-bold text-[10px] uppercase">GERAKAN PRAMUKA GUGUS DEPAN 10.055 – 10.056[cite: 1]</p>
                    <h2 className="text-base font-black uppercase">PANGKALAN SD NEGERI WATUTULIS 2[cite: 1]</h2>
                    <p className="text-[10px] text-gray-600">Kecamatan Prambon, Kabupaten Sidoarjo • Tahun 2026[cite: 1]</p>
                    <h3 className="font-bold text-xs uppercase underline mt-2">BERITA ACARA REGU BERPRESTASI LT-1 TAHUN 2026[cite: 1]</h3>
                  </div>

                  <div>
                    <h4 className="font-bold text-xs uppercase mb-1">A. Hasil Klasemen Penggalang Putra (PA)</h4>
                    <table className="w-full text-left border border-gray-400 text-[11px]">
                      <thead className="bg-gray-100">
                        <tr>
                          <th className="p-1 border border-gray-300">Rank</th>
                          <th className="p-1 border border-gray-300">Regu</th>
                          <th className="p-1 border border-gray-300 text-center">Emas</th>
                          <th className="p-1 border border-gray-300 text-center">Perak</th>
                          <th className="p-1 border border-gray-300 text-center">Perunggu</th>
                          <th className="p-1 border border-gray-300 text-right">Skor</th>
                          <th className="p-1 border border-gray-300">Gelar Prestasi</th>
                        </tr>
                      </thead>
                      <tbody>
                        {overallStandings.PA.map(r => (
                          <tr key={r.team.id}>
                            <td className="p-1 border border-gray-300 text-center font-bold">{r.rank}</td>
                            <td className="p-1 border border-gray-300 font-bold">Regu {r.team.name}</td>
                            <td className="p-1 border border-gray-300 text-center">{r.gold}</td>
                            <td className="p-1 border border-gray-300 text-center">{r.silver}</td>
                            <td className="p-1 border border-gray-300 text-center">{r.bronze}</td>
                            <td className="p-1 border border-gray-300 text-right font-mono">{r.totalOverallScore}</td>
                            <td className="p-1 border border-gray-300 font-bold">{r.title}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div>
                    <h4 className="font-bold text-xs uppercase mb-1">B. Hasil Klasemen Penggalang Putri (PI)</h4>
                    <table className="w-full text-left border border-gray-400 text-[11px]">
                      <thead className="bg-gray-100">
                        <tr>
                          <th className="p-1 border border-gray-300">Rank</th>
                          <th className="p-1 border border-gray-300">Regu</th>
                          <th className="p-1 border border-gray-300 text-center">Emas</th>
                          <th className="p-1 border border-gray-300 text-center">Perak</th>
                          <th className="p-1 border border-gray-300 text-center">Perunggu</th>
                          <th className="p-1 border border-gray-300 text-right">Skor</th>
                          <th className="p-1 border border-gray-300">Gelar Prestasi</th>
                        </tr>
                      </thead>
                      <tbody>
                        {overallStandings.PI.map(r => (
                          <tr key={r.team.id}>
                            <td className="p-1 border border-gray-300 text-center font-bold">{r.rank}</td>
                            <td className="p-1 border border-gray-300 font-bold">Regu {r.team.name}</td>
                            <td className="p-1 border border-gray-300 text-center">{r.gold}</td>
                            <td className="p-1 border border-gray-300 text-center">{r.silver}</td>
                            <td className="p-1 border border-gray-300 text-center">{r.bronze}</td>
                            <td className="p-1 border border-gray-300 text-right font-mono">{r.totalOverallScore}</td>
                            <td className="p-1 border border-gray-300 font-bold">{r.title}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
